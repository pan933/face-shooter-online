<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><title>顔つなぎパズル</title>
<style>
:root{color-scheme:dark;--panel:#1b2130;--line:#343e55;--gold:#ffd76a;--cyan:#72e7f2;--text:#f5f6fb;--muted:#aab4c7}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#26324c,#10131d 65%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button,select{font:inherit}button{cursor:pointer}.shell{width:min(100%,760px);margin:auto;padding:16px 14px 30px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.brand{font-weight:1000;font-size:clamp(22px,5vw,32px)}.sub{color:var(--muted);font-size:13px;margin:3px 0 0}.top a,.top button{border:1px solid var(--line);background:#202a3c;color:var(--text);border-radius:12px;padding:10px 13px;text-decoration:none}.panel{background:linear-gradient(145deg,#202a3c,#171d2b);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:14px}.profile{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.portrait{width:64px;height:64px;border-radius:50%;overflow:hidden;background:#0d1320;border:2px solid var(--gold);display:grid;place-items:center;flex:none}.portrait img{width:100%;height:100%;object-fit:cover}.profileInfo{flex:1;min-width:140px}.profileInfo strong{font-size:18px}.profileInfo small{display:block;color:var(--muted);margin-top:3px}.profile select{max-width:100%;margin-top:8px;background:#111827;color:white;border:1px solid var(--line);border-radius:9px;padding:8px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.stat{background:#111827;border:1px solid #303b50;border-radius:12px;text-align:center;padding:9px 4px}.stat span{display:block;color:var(--muted);font-size:11px}.stat strong{font-size:clamp(19px,4vw,25px);font-weight:1000}.progress{height:9px;background:#0b1020;border-radius:99px;overflow:hidden;margin-top:10px;border:1px solid #303b50}.progress>i{display:block;width:0;height:100%;background:linear-gradient(90deg,#55d7e8,#ffe071);transition:width .15s}.boardWrap{position:relative;margin:14px auto 0;max-width:580px;touch-action:none;user-select:none}.board{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;padding:9px;border-radius:17px;background:linear-gradient(145deg,#0c1321,#202b40);border:1px solid #3c4a63}.tile{aspect-ratio:1;border:2px solid #65728a;border-radius:50%;padding:2px;min-width:0;background:radial-gradient(circle at 35% 25%,#53627b,#1b2435 72%);display:grid;place-items:center;transition:transform .12s,border-color .12s,filter .12s;overflow:hidden}.tile img{width:100%;height:100%;border-radius:50%;object-fit:cover;pointer-events:none}.tile.selected{border:3px solid var(--gold);transform:scale(.91);filter:brightness(1.25);box-shadow:0 0 0 2px #ffdc6a55,0 0 16px #ffdc6a66}.tile:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}.actions{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-top:14px}.primary{background:linear-gradient(135deg,#ffe48a,#ffad4b);color:#241a0a;border:0;border-radius:13px;padding:13px 18px;font-weight:1000;min-height:48px}.secondary{background:#29354b;color:white;border:1px solid #52617a;border-radius:13px;padding:12px 15px;min-height:48px}.primary:disabled,.secondary:disabled{opacity:.45;cursor:not-allowed}.help{color:var(--muted);font-size:13px;line-height:1.65;text-align:center;margin:10px 4px 0}.message{min-height:22px;text-align:center;color:var(--cyan);font-weight:700;margin-top:10px}.overlay{position:fixed;inset:0;background:#050812d9;display:grid;place-items:center;padding:16px;z-index:10}.dialog{width:min(100%,420px);background:#1b2435;border:1px solid #596780;border-radius:20px;padding:22px;text-align:center}.dialog h2{margin:0 0 8px;font-size:26px}.dialog p{color:var(--muted);line-height:1.6}.hidden{display:none!important}@media(max-width:420px){.shell{padding:11px 9px 24px}.board{gap:4px;padding:6px}.tile{border-width:1px}.panel{padding:11px}.stats{gap:5px}.stat{padding:8px 2px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head><body><main class="shell">
<header class="top"><div><div class="brand">🎭 顔つなぎパズル</div><p class="sub">集めた顔をつないで、どんどん消そう！</p></div><div><a href="./game.html">シューティングへ</a> <button id="logout" type="button">ログアウト</button></div></header>
<section class="panel"><div class="profile"><div class="portrait"><img id="leaderFace" alt="選択中の顔"><span id="leaderFallback" hidden>🙂</span></div><div class="profileInfo"><strong id="leaderName">データ読み込み中…</strong><small id="leaderSkill">所持している顔を読み込んでいます</small><label><select id="faceSelect" aria-label="使用する顔" disabled></select></label></div></div>
<div class="stats"><div class="stat"><span>スコア</span><strong id="score">0</strong></div><div class="stat"><span>のこり時間</span><strong id="time">60</strong></div><div class="stat"><span>コンボ</span><strong id="combo">0</strong></div></div><div class="progress" aria-label="フィーバーゲージ"><i id="feverFill"></i></div><div class="help">同じ顔を3個以上、隣り合うようになぞってね。長くつなぐほど高得点！<br>ゲージが満タンになると「顔面フィーバー」が使えるよ。</div></section>
<section class="panel"><div class="boardWrap"><div id="board" class="board" aria-label="パズル盤面"></div></div><div class="actions"><button id="start" class="primary" type="button" disabled>▶ ゲーム開始</button><button id="fever" class="secondary" type="button" disabled>✨ 顔面フィーバー</button><button id="pause" class="secondary" type="button" disabled>⏸ 一時停止</button></div><div id="message" class="message" role="status" aria-live="polite">アカウントを確認しています…</div></section>
<p class="help">アカウント・所持顔・選択中の顔・ポイントはシューティング版と共通です。</p></main>
<div id="result" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="resultTitle"><section class="dialog"><h2 id="resultTitle">🎉 結果発表</h2><p id="resultText"></p><button id="again" class="primary" type="button">もう一度遊ぶ</button><button id="back" class="secondary" type="button">シューティングへ戻る</button></section></div>
<script type="module" src="./js/puzzle.js"></script></body></html>
