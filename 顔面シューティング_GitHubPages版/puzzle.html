<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>顔つなぎパズル</title>
<style>
:root{color-scheme:dark;--panel:#1b2434;--line:#39475f;--gold:#ffda75;--cyan:#73e9f0;--text:#f7f8fc;--muted:#aab6c9}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#35445f,#111722 62%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
button,select{font:inherit}button{cursor:pointer}.shell{width:min(100%,760px);margin:auto;padding:14px 13px 28px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.brand{font-size:clamp(23px,5vw,32px);font-weight:1000;letter-spacing:.02em}.sub{margin:3px 0 0;color:var(--muted);font-size:13px}
.top a,.top button{border:1px solid var(--line);background:#202d42;color:var(--text);border-radius:12px;padding:10px 12px;text-decoration:none;min-height:42px}
.panel{background:linear-gradient(145deg,#202c40,#171f2e);border:1px solid var(--line);border-radius:18px;padding:13px;margin-top:13px;box-shadow:0 8px 24px #0003}
.profile{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.portrait{width:62px;height:62px;border-radius:50%;overflow:hidden;background:#0c1422;border:2px solid var(--gold);display:grid;place-items:center;flex:none}.portrait img{width:100%;height:100%;object-fit:cover}
.profileInfo{flex:1;min-width:145px}.profileInfo strong{font-size:18px}.profileInfo small{display:block;color:var(--muted);margin-top:3px}.profile select{max-width:100%;margin-top:7px;background:#111a29;color:white;border:1px solid var(--line);border-radius:9px;padding:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}.stat{background:#101827;border:1px solid #34435b;border-radius:12px;text-align:center;padding:8px 4px}.stat span{display:block;color:var(--muted);font-size:11px}.stat strong{font-size:clamp(20px,4vw,26px);font-weight:1000}
.progress{height:9px;background:#0b1020;border-radius:99px;overflow:hidden;margin-top:10px;border:1px solid #34435b}.progress>i{display:block;width:0;height:100%;background:linear-gradient(90deg,#55d7e8,#ffe071);transition:width .15s}
.boardWrap{position:relative;margin:12px auto 0;max-width:560px;padding:8px;border-radius:22px;background:linear-gradient(145deg,#0a1220,#263750);border:1px solid #43536c;box-shadow:inset 0 0 30px #0008,0 10px 28px #0005;touch-action:none;overflow:hidden}
#boardCanvas{display:block;width:100%;height:auto;border-radius:15px;touch-action:none;user-select:none}
.modeBar{display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:12px;padding:10px;background:#101827;border:1px solid #34435b;border-radius:12px;font-size:13px}.modeBar strong{color:var(--gold)}.modeBar button{min-height:38px;padding:8px 11px;font-size:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:13px}.primary,.secondary{border-radius:13px;padding:12px 15px;min-height:48px;font-weight:850}
.primary{background:linear-gradient(135deg,#ffe48a,#ffad4b);color:#241a0a;border:0}.secondary{background:#293950;color:white;border:1px solid #526782}
button:disabled{opacity:.42;cursor:not-allowed}.help{color:var(--muted);font-size:13px;line-height:1.65;text-align:center;margin:10px 4px 0}.message{min-height:23px;text-align:center;color:var(--cyan);font-weight:750;margin-top:10px}
.overlay{position:fixed;inset:0;background:#050812dc;display:grid;place-items:center;padding:16px;z-index:10}.dialog{width:min(100%,420px);background:#1b2435;border:1px solid #596780;border-radius:20px;padding:22px;text-align:center}.dialog h2{margin:0 0 8px;font-size:26px}.dialog p{color:var(--muted);line-height:1.6}.hidden{display:none!important}
@media(max-width:420px){.shell{padding:10px 8px 22px}.panel{padding:10px}.stats{gap:5px}.stat{padding:7px 2px}.actions{gap:6px}.actions button{flex:1 1 42%;padding:10px 8px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}
</style>
</head>
<body>
<main class="shell">
<header class="top"><div><div class="brand">🎭 顔つなぎパズル</div><p class="sub">ころころ落ちる顔をつなげて消そう！</p></div><div><a href="./game.html">シューティングへ</a> <button id="logout" type="button">ログアウト</button></div></header>
<section class="panel">
 <div class="profile"><div class="portrait"><img id="leaderFace" alt="選択中の顔"><span id="leaderFallback" hidden>🙂</span></div><div class="profileInfo"><strong id="leaderName">データ読み込み中…</strong><small id="leaderSkill">所持顔を読み込んでいます</small><label><select id="faceSelect" aria-label="使用する顔" disabled></select></label></div></div>
 <div class="stats"><div class="stat"><span>スコア</span><strong id="score">0</strong></div><div class="stat"><span>のこり時間</span><strong id="time">60</strong></div><div class="stat"><span>コンボ</span><strong id="combo">0</strong></div></div>
 <div class="progress" aria-label="フィーバーゲージ"><i id="feverFill"></i></div>
 <div class="modeBar"><span>使用する顔：<strong id="faceMode">5種類</strong></span><span>所持ポイント：<strong id="pointsBalance">0</strong></span><button id="unlockFour" class="secondary" type="button" disabled>4種類モードを解放（5,000pt）</button></div>
 <p class="help">同じ顔を指でなぞって3個以上つなげよう！消えた場所には上から新しい顔が落ちてくるよ。<br>顔はぶつかり合いながら積み重なるよ。シャッフルで配置をかき混ぜよう！</p>
</section>
<section class="panel">
 <div class="boardWrap"><canvas id="boardCanvas" aria-label="物理演算パズル盤面"></canvas></div>
 <div class="actions"><button id="start" class="primary" type="button" disabled>▶ ゲーム開始</button><button id="shuffle" class="secondary" type="button" disabled>🔀 シャッフル</button><button id="fever" class="secondary" type="button" disabled>✨ 顔面フィーバー</button><button id="pause" class="secondary" type="button" disabled>⏸ 一時停止</button></div>
 <div class="help">シャッフル再使用：<strong id="shuffleCooldown">いつでもOK</strong></div>
 <div id="message" class="message" role="status" aria-live="polite">アカウントを確認しています…</div>
</section>
<p class="help">アカウント・所持顔・ポイントはシューティング版と共通です。</p>
</main>
<div id="result" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="resultTitle"><section class="dialog"><h2 id="resultTitle">🎉 結果発表</h2><p id="resultText"></p><button id="again" class="primary" type="button">もう一度遊ぶ</button><button id="back" class="secondary" type="button">シューティングへ戻る</button></section></div>
<script type="module" src="./js/puzzle.js"></script>
</body></html>
