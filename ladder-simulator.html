<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PLC Ladder Lab</title><link rel="stylesheet" href="ladder-lab.css"></head>
<body><header><div><h1>PLC Ladder Lab</h1><small>ラダー編集・仮想PLC実習盤</small></div><div id="plcBadge">STOP</div></header>
<nav><button class="tab active" data-tab="editor">ラダー編集</button><button class="tab" data-tab="board">仮想実習盤</button><button class="tab" data-tab="monitor">デバイスモニタ</button></nav>
<main><section id="editor" class="pane active"><aside class="tools"><h2>命令パレット</h2><div id="palette"></div><h3>配置デバイス</h3><select id="deviceType"><option>X 入力</option><option>M 内部リレー</option><option>Y 出力</option><option>T タイマー</option><option>C カウンタ</option></select><input id="deviceNo" type="number" min="0" value="0"><button id="applyDevice">選択デバイスに変更</button><hr><button id="addRung">＋回路段</button><button id="addBranch">＋並列分岐（選択段）</button><button id="delRung">選択段を削除</button><button id="clear">回路クリア</button><button id="sample">サンプル回路</button><button id="save">JSON保存</button><button id="load">JSON読込</button><input id="file" type="file" accept=".json" hidden></aside><div class="workarea"><div class="toolbar"><button id="run">▶ RUN</button><button id="stop">■ STOP</button><button id="scan">１スキャン</button><button id="reset">リセット</button><span id="status">停止中</span></div><div id="ladder"></div><p class="hint">空きセルをクリックして配置。分岐は選択した段に追加されます。実行中の導通は色で表示。</p></div></section>
<section id="board" class="pane"><h2>仮想実習盤</h2><div class="board"><div class="conveyor"><div class="belt"></div><div id="workpiece">■</div><div class="sensor s1">X7<br>MS1</div><div class="sensor s2">X8<br>MS2</div></div><div class="controls" id="inputs"></div><div class="outputs" id="outputs"></div></div></section>
<section id="monitor" class="pane"><h2>デバイスモニタ</h2><div id="deviceTable"></div><h2>スキャンログ</h2><div id="log"></div></section></main><script type="module" src="ladder-lab.js"></script></body></html>
