<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ラダーシミュレーター</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Meiryo",sans-serif;background:#101722;color:#e8eef8}header{padding:16px 20px;background:#182435;border-bottom:1px solid #33465d}h1{margin:0;font-size:22px}main{display:grid;grid-template-columns:260px 1fr 280px;gap:14px;padding:14px}.panel{background:#192536;border:1px solid #30445c;border-radius:12px;padding:14px}h2{font-size:16px;margin:0 0 12px}button,select,input{background:#26384c;color:#f1f5fb;border:1px solid #415a76;border-radius:7px;padding:8px;cursor:pointer}button:hover{background:#354d67}.tools button{width:100%;margin:4px 0;text-align:left}.tools button.active{outline:2px solid #58b4ff;background:#315277}.grid{overflow:auto}.rung{display:grid;grid-template-columns:42px repeat(6,minmax(85px,1fr)) 90px;gap:6px;align-items:center;margin:8px 0;padding:8px;background:#14202e;border-radius:8px}.cell{height:55px;display:flex;align-items:center;justify-content:center;border:1px dashed #49617a;border-radius:6px;position:relative}.cell button{width:100%;height:100%;background:transparent;border:0;font-size:12px}.cell.filled{border-style:solid;border-color:#7da6cb}.symbol{font-size:14px;font-weight:bold}.coil{border:2px solid #8ac0f5;border-radius:50%;padding:6px}.status{color:#a9c2dd;font-size:13px}.inputs,.outputs{display:grid;grid-template-columns:1fr 1fr;gap:6px}.io{padding:8px;background:#223247;border-radius:7px}.io label{font-size:12px;display:block;margin-bottom:5px}.io input[type=text]{width:100%;margin-bottom:5px}.io button{width:100%}.on{background:#276e49!important}.out{margin:6px 0;padding:9px;border-radius:7px;background:#223247}.machine{height:130px;background:#0f1926;border:1px solid #344a62;border-radius:10px;margin-top:10px;position:relative;overflow:hidden}.belt{position:absolute;bottom:18px;left:0;right:0;height:15px;background:#435468}.motor{position:absolute;left:25px;bottom:38px;font-size:30px}.cylinder{position:absolute;right:35px;bottom:38px;font-size:30px}.lamp{position:absolute;top:12px;right:15px;font-size:26px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.actions button{font-weight:600}.small{font-size:12px;color:#9bb2c9}.log{max-height:120px;overflow:auto;font-size:12px;color:#c3d3e4}.rowbtn{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}@media(max-width:900px){main{grid-template-columns:1fr}.rung{grid-template-columns:35px repeat(6,minmax(60px,1fr)) 70px}}
</style></head><body>
<header><h1>⚙ ラダーシミュレーター</h1><div class="status">ブラウザ内動作・練習用簡易PLC</div></header>
<main><aside class="panel tools"><h2>配置ツール</h2><div id="toolbuttons"></div><label>デバイス種別</label><select id="devtype"><option>X 入力</option><option>M 内部リレー</option><option>Y 出力</option><option>T タイマー</option><option>C カウンタ</option></select><label>番号</label><select id="devnum"></select><p class="small">ツールを選択して、ラダーの空欄「＋」を押して配置。</p><h2>サンプル回路</h2><button onclick="sample('seal')">自己保持回路</button><button onclick="sample('interlock')">インターロック</button><button onclick="sample('timer')">タイマー遅延</button><button onclick="sample('counter')">カウンタ</button><button onclick="sample('blank')">空回路</button></aside>
<section class="panel grid"><h2>ラダー編集</h2><div class="actions"><button onclick="run()">▶ RUN</button><button onclick="stop()">■ STOP</button><button onclick="scan()">1スキャン</button><button onclick="reset()">リセット</button><button onclick="addRung()">＋ ラダー追加</button><button onclick="save()">保存(JSON)</button><button onclick="load()">読み込み</button><input id="file" type="file" accept=".json" hidden onchange="loadFile(event)"></div><div id="ladder"></div><div class="small">各段は左から右へ判定。条件が成立すると右端のコイルを動作させます。分岐などは今後拡張予定。</div></section>
<aside class="panel"><h2>入力 X</h2><div id="inputs" class="inputs"></div><h2 style="margin-top:15px">出力割当</h2><div id="assign"></div><h2 style="margin-top:15px">仮想機械</h2><div class="machine"><div class="lamp" id="lamp">💡</div><div class="motor" id="motor">⚙️</div><div class="cylinder" id="cylinder">🛠️</div><div class="belt"></div></div><h2 style="margin-top:15px">状態 / ログ</h2><div id="state" class="status"></div><div id="log" class="log"></div></aside></main>
<script>
let tools=['NO','NC','コイル','SET','RST','TON','CTU','削除'],selected='NO',rungs=[{cells:[],coil:{type:'Y',n:0}}],inputs=Array.from({length:6},(_,i)=>({name:['スタート','停止','センサー3','センサー4','センサー5','センサー6'][i],v:false})),assignments=['ランプ','モーター','シリンダー','ブザー'],outputs={},running=false,timer={},counter={};
const devtype=document.getElementById('devtype'),devnum=document.getElementById('devnum');
function fillnums(){devnum.innerHTML='';for(let i=0;i<16;i++){let o=document.createElement('option');o.value=i;o.text=i;devnum.append(o)}}fillnums();
function toolUI(){let d=document.getElementById('toolbuttons');d.innerHTML='';tools.forEach(t=>{let b=document.createElement('button');b.textContent=t;b.className=selected===t?'active':'';b.onclick=()=>{selected=t;toolUI()};d.append(b)})}
function device(){return {type:devtype.value.split(' ')[0],n:+devnum.value}}
function render(){let d=document.getElementById('ladder');d.innerHTML='';rungs.forEach((r,ri)=>{let row=document.createElement('div');row.className='rung';let num=document.createElement('div');num.textContent=ri+1;row.append(num);for(let ci=0;ci<6;ci++){let cell=document.createElement('div');cell.className='cell '+(r.cells[ci]?'filled':'');let b=document.createElement('button');b.innerHTML=r.cells[ci]?symbol(r.cells[ci]):'＋配置';b.onclick=()=>place(ri,ci);cell.append(b);row.append(cell)}let co=document.createElement('div');co.className='cell filled';let cb=document.createElement('button');cb.innerHTML='<span class="coil">('+r.coil.type+r.coil.n+')</span>';cb.onclick=()=>{r.coil=device();render()};co.append(cb);row.append(co);d.append(row)})}
function symbol(x){return x.type==='NO'?'—[ '+x.dev+' ]—':x.type==='NC'?'—[/ '+x.dev+' ]—':x.type==='SET'?'SET '+x.dev:x.type==='RST'?'RST '+x.dev:x.type==='TON'?'TON '+x.dev:x.type==='CTU'?'CTU '+x.dev:'×'}
function place(ri,ci){if(selected==='削除'){rungs[ri].cells[ci]=null}else{rungs[ri].cells[ci]={type:selected,dev:device().type+device().n}}render()}
function addRung(){rungs.push({cells:[],coil:device()});render()}
function sample(s){if(s==='blank'){rungs=[{cells:[],coil:{type:'Y',n:0}}]}if(s==='seal'){rungs=[{cells:[{type:'NO',dev:'X0'},{type:'NO',dev:'M0'}],coil:{type:'M',n:0}},{cells:[{type:'NO',dev:'M0'}],coil:{type:'Y',n:0}}]}if(s==='interlock'){rungs=[{cells:[{type:'NO',dev:'X0'},{type:'NC',dev:'Y1'}],coil:{type:'Y',n:0}},{cells:[{type:'NO',dev:'X1'},{type:'NC',dev:'Y0'}],coil:{type:'Y',n:1}}]}if(s==='timer'){rungs=[{cells:[{type:'NO',dev:'X0'},{type:'TON',dev:'T0'}],coil:{type:'Y',n:0}}]}if(s==='counter'){rungs=[{cells:[{type:'NO',dev:'X0'},{type:'CTU',dev:'C0'}],coil:{type:'Y',n:0}}]}render()}
function inputUI(){let d=document.getElementById('inputs');d.innerHTML='';inputs.forEach((x,i)=>{let box=document.createElement('div');box.className='io';box.innerHTML='<label>X'+i+'</label><input type="text" value="'+x.name.replace(/"/g,'&quot;')+'"><button class="'+(x.v?'on':'')+'">'+(x.v?'ON':'OFF')+'</button>';box.querySelector('input').onchange=e=>x.name=e.target.value;box.querySelector('button').onclick=e=>{x.v=!x.v;inputUI()};d.append(box)})}
function assignUI(){let d=document.getElementById('assign');d.innerHTML='';assignments.forEach((a,i)=>{let box=document.createElement('div');box.className='io';box.innerHTML='<label>Y'+i+' の動作</label><select>'+['未割当','ランプ','モーター','コンベア','シリンダー','ブザー'].map(o=>'<option>'+o+'</option>').join('')+'</select>';box.querySelector('select').value=a;box.querySelector('select').onchange=e=>{assignments[i]=e.target.value;renderOutputs()};d.append(box)})}
function evalDev(dev){if(dev[0]==='X')return inputs[+dev.slice(1)]?.v||false;if(dev[0]==='Y'||dev[0]==='M')return !!outputs[dev];return false}
function scan(){let next={...outputs};rungs.forEach(r=>{let val=true;for(let c of r.cells){if(!c)continue;if(c.type==='NO')val=val&&evalDev(c.dev);if(c.type==='NC')val=val&&!evalDev(c.dev);if(c.type==='SET'&&val)next[c.dev]=true;if(c.type==='RST'&&val)next[c.dev]=false;}let co=r.coil.type+r.coil.n;if(val){if(r.coil.type==='Y'||r.coil.type==='M')next[co]=true;}else if(r.coil.type==='Y'||r.coil.type==='M')next[co]=false});outputs=next;renderOutputs();document.getElementById('state').textContent='出力: '+Object.entries(outputs).filter(([k,v])=>v).map(([k])=>k).join(', ')}
function renderOutputs(){document.getElementById('lamp').textContent=outputs.Y0?'💡':'⚪';document.getElementById('motor').textContent=outputs.Y1?'⚙️回転':'⚙️';document.getElementById('cylinder').textContent=outputs.Y2?'🛠️伸長':'🛠️'}
function run(){if(running)return;running=true;log('RUN開始');window.scanInterval=setInterval(scan,250)}function stop(){running=false;clearInterval(window.scanInterval);log('STOP')}function reset(){stop();outputs={};timer={};counter={};renderOutputs();log('リセット')}
function log(t){let l=document.getElementById('log');l.innerHTML=t+'<br>'+l.innerHTML}
function save(){let data={rungs,inputs,assignments};let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='ladder.json';a.click()}
function load(){document.getElementById('file').click()}function loadFile(e){let f=e.target.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{try{let d=JSON.parse(reader.result);rungs=d.rungs||rungs;inputs=d.inputs||inputs;assignments=d.assignments||assignments;render();inputUI();assignUI()}catch(err){alert('ファイルを読み込めません')}};reader.readAsText(f)}
toolUI();render();inputUI();assignUI();renderOutputs();
</script></body></html>
