<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>シーケンス制御 仮想実習盤</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111a26;color:#e5edf7;font-family:system-ui,Meiryo,sans-serif}header{background:#19283a;padding:14px 18px;border-bottom:1px solid #344a60}h1{font-size:20px;margin:0}main{padding:14px;display:grid;grid-template-columns:minmax(500px,1.5fr) minmax(400px,1fr);gap:14px}.panel{background:#192638;border:1px solid #354b63;border-radius:12px;padding:14px}h2{font-size:16px;margin:0 0 12px}button,select,input{font:inherit;color:inherit;background:#293d53;border:1px solid #49647e;border-radius:7px;padding:7px}button{cursor:pointer}button:hover{background:#3a536d}.row{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0}.board{background:#d7d6d1;color:#1a2026;border-radius:12px;padding:16px;box-shadow:inset 0 0 0 3px #a6a7a5;position:relative}.boardtitle{text-align:center;font-weight:800;margin-bottom:10px}.terminals{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;background:#1d2b39;padding:8px;border-radius:8px;margin-bottom:12px}.terminal{height:32px;background:#b5b6b7;border-radius:4px;color:#18202a;text-align:center;font-size:11px;padding-top:8px;font-weight:bold}.conveyor{height:170px;background:#9c9d9a;border:3px solid #6e7478;border-radius:8px;position:relative;margin:10px 0;overflow:hidden}.belt{position:absolute;left:9%;right:9%;top:45px;height:75px;background:repeating-linear-gradient(90deg,#29333b 0 25px,#45515a 25px 30px);border:4px solid #202a31;border-radius:7px}.roller{position:absolute;top:40px;width:20px;height:85px;background:#c6c8c7;border-radius:10px;border:2px solid #616a70}.roller.left{left:7%}.roller.right{right:7%}.work{width:34px;height:34px;position:absolute;top:64px;left:10%;background:#e5a342;border:3px solid #875820;border-radius:5px;transition:left .1s;z-index:2}.sensor{position:absolute;top:24px;width:25px;height:130px;border:3px solid #2179a8;background:#55b4e8aa;border-radius:5px;z-index:3}.sensor.s1{left:34%}.sensor.s2{left:69%}.sensorlabel{position:absolute;top:3px;font-size:12px;font-weight:bold;color:#0e3044}.sensor.s1 .sensorlabel{left:-4px}.sensor.s2 .sensorlabel{left:-4px}.boardcontrols{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.control{background:#c5c9ca;color:#111;border-radius:7px;padding:8px;text-align:center}.control small{display:block}.control button{width:100%;margin-top:6px;color:#fff}.push{background:#317da4}.push.active{background:#27a361}.toggle{background:#576b79}.toggle.active{background:#d59a35;color:#111}.lamp{width:22px;height:22px;border-radius:50%;background:#58616b;margin:5px auto;border:2px solid #444}.lamp.on{background:#ffd34b;box-shadow:0 0 14px #ffd34b}.lamp.green.on{background:#45dc85;box-shadow:0 0 12px #45dc85}.lamp.red.on{background:#ff5e5e;box-shadow:0 0 12px #ff5e5e}.ladder{overflow:auto}.rung{background:#101c2a;border-radius:9px;margin:10px 0;padding:10px;min-width:650px}.rungrow{display:flex;align-items:center;gap:0}.rail{width:5px;height:90px;background:#b1c9de}.wire{height:3px;background:#738ca5;flex:1;min-width:18px}.element{width:100px;height:70px;flex:none;border:1px dashed #57718b;border-radius:8px;display:flex;align-items:center;justify-content:center;background:#1e3043}.element.filled{border-style:solid}.element button{background:transparent;border:0;width:100%;height:100%;font-size:15px}.symbol{font-size:18px;font-weight:700;text-align:center}.symbol small{display:block;font-size:11px;color:#adc6df}.coil{border:2px solid #b5cee7;border-radius:40px;width:100px;height:70px;flex:none;display:grid;place-items:center}.palette{display:flex;flex-wrap:wrap;gap:6px}.palette button.sel{outline:2px solid #66baff}.small{font-size:12px;color:#a8bfd5}.statusgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.statebox{padding:8px;background:#223449;border-radius:8px}.logs{max-height:130px;overflow:auto;font-size:12px;white-space:pre-wrap}.ontext{color:#5cdd98;font-weight:bold}@media(max-width:1000px){main{grid-template-columns:1fr}}
</style></head><body><header><h1>⚡ シーケンス制御・仮想実習盤</h1><div style="color:#adc3d8;font-size:12px">コンベヤ実習盤を模したブラウザ学習シミュレーター</div></header><main>
<section class="panel"><h2>仮想実習盤</h2><div class="board"><div class="boardtitle">MK-SK1 相当・仮想シーケンス実習盤</div><div class="terminals" id="terminals"></div><div class="conveyor"><div class="belt"></div><div class="roller left"></div><div class="roller right"></div><div class="work" id="work"></div><div class="sensor s1"><span class="sensorlabel">MS1</span></div><div class="sensor s2"><span class="sensorlabel">MS2</span></div></div><div class="boardcontrols" id="controls"></div></div><div class="row"><button onclick="run()">▶ RUN</button><button onclick="stop()">■ STOP</button><button onclick="stepScan()">1スキャン</button><button onclick="resetAll()">リセット</button></div><h2 style="margin-top:16px">機器状態</h2><div class="statusgrid" id="states"></div></section>
<section class="panel"><h2>ラダー編集</h2><div class="palette" id="palette"></div><div class="row"><label>デバイス <select id="dtype"><option>X</option><option>Y</option><option>M</option><option>T</option><option>C</option></select></label><label>番号 <select id="dnum"></select></label><button onclick="addRung()">＋段追加</button><button onclick="preset('startstop')">運転/停止サンプル</button><button onclick="preset('auto')">センサー自動サンプル</button><button onclick="preset('clear')">空回路</button><button onclick="saveJSON()">保存</button><button onclick="loadJSON()">読込</button></div><div class="ladder" id="ladder"></div><div class="small">常開接点 —| |— / 常閉接点 —|/|— / コイル —( )— を図記号表示。各段は直列接点の基本評価。複雑な分岐は今後の拡張。</div><h2 style="margin-top:15px">PLC状態・ログ</h2><div class="small" id="plcstatus"></div><div class="logs" id="logs"></div></section>
</main><script>
const tools=[['NO','常開 —| |—'],['NC','常閉 —|/|—'],['COIL','コイル —( )—'],['SET','SET (S)'],['RST','RESET (R)'],['TON','タイマー TON'],['CTU','カウンタ CTU'],['DEL','消去']];
let chosen='NO',rungs=[{cells:[{type:'NO',dev:'X0'},{type:'NC',dev:'X1'}],coil:{type:'Y',n:0}}],xv={},yv={},mv={},tv={},cv={},timers={},counterEdge={},inputs={PB1:false,PB2:false,PB3:false,PB4:false,SSW:false,DIP1:false,DIP2:false,MS1:false,MS2:false},workPos=10,conveyor=false,running=false,interval=null,scans=0;
const mapping={PB1:'X0',PB2:'X1',PB3:'X2',PB4:'X3',SSW:'X4',DIP1:'X5',DIP2:'X6',MS1:'X7',MS2:'X8'};
let names={PB1:'PB1 起動',PB2:'PB2 停止',PB3:'PB3',PB4:'PB4',SSW:'切替スイッチ',DIP1:'デジタルSW1',DIP2:'デジタルSW2',MS1:'マイクロスイッチ1',MS2:'マイクロスイッチ2'};
let devtype=document.getElementById('dtype'),devnum=document.getElementById('dnum');
for(let i=0;i<32;i++){let o=document.createElement('option');o.value=i;o.text=i;devnum.append(o)}
function toolUI(){let e=document.getElementById('palette');e.innerHTML='';tools.forEach(([id,label])=>{let b=document.createElement('button');b.textContent=label;b.className=id===chosen?'sel':'';b.onclick=()=>{chosen=id;toolUI()};e.append(b)})}
function termUI(){let e=document.getElementById('terminals');e.innerHTML='';for(let i=0;i<12;i++){let d=document.createElement('div');d.className='terminal';d.textContent='端子 '+i;e.append(d)}}
function controlUI(){let e=document.getElementById('controls');e.innerHTML='';Object.keys(names).forEach(k=>{let box=document.createElement('div');box.className='control';box.innerHTML='<small>'+names[k]+'</small><button class="'+(inputs[k]?'active':'')+'">'+(inputs[k]?'ON':'OFF')+'</button>';box.querySelector('button').onclick=()=>{if(k==='PB1'||k==='PB2'||k==='PB3'||k==='PB4'){inputs[k]=true;setTimeout(()=>{inputs[k]=false;controlUI()},180)}else inputs[k]=!inputs[k];controlUI();refreshInputBits()};e.append(box)});['PL1','PL2','PL3','PL4','POWER'].forEach((k,i)=>{let box=document.createElement('div');box.className='control';box.innerHTML='<small>'+k+'</small><div class="lamp '+(i===0?'green':i===1?'red':'')+' '+(lampStates()[i]?'on':'')+'"></div>';e.append(box)})}
function refreshInputBits(){xv.X0=inputs.PB1;xv.X1=inputs.PB2;xv.X2=inputs.PB3;xv.X3=inputs.PB4;xv.X4=inputs.SSW;xv.X5=inputs.DIP1;xv.X6=inputs.DIP2;xv.X7=inputs.MS1;xv.X8=inputs.MS2}
function lampStates(){return [!!yv.Y0,!!yv.Y1,!!yv.Y2,!!yv.Y3,true]}
function dev(){return devtype.value+devnum.value}
function displayCell(c){if(!c)return '＋配置';if(c.type==='NO')return '<div class="symbol">—| |—<small>'+c.dev+'</small></div>';if(c.type==='NC')return '<div class="symbol">—|/|—<small>'+c.dev+'</small></div>';if(c.type==='SET')return '<div class="symbol">( S )<small>'+c.dev+'</small></div>';if(c.type==='RST')return '<div class="symbol">( R )<small>'+c.dev+'</small></div>';if(c.type==='TON')return '<div class="symbol">TON<small>'+c.dev+' '+c.ms+'ms</small></div>';if(c.type==='CTU')return '<div class="symbol">CTU<small>'+c.dev+' ×'+c.target+'</small></div>';return '×'}
function renderLadder(){let e=document.getElementById('ladder');e.innerHTML='';rungs.forEach((r,i)=>{let card=document.createElement('div');card.className='rung';card.innerHTML='<div class="small">段 '+(i+1)+' <button onclick="removeRung('+i+')">削除</button></div>';let row=document.createElement('div');row.className='rungrow';let rail=document.createElement('div');rail.className='rail';row.append(rail);r.cells.forEach((c,j)=>{let el=document.createElement('div');el.className='element '+(c?'filled':'');let b=document.createElement('button');b.innerHTML=displayCell(c);b.onclick=()=>put(i,j);el.append(b);row.append(el);let w=document.createElement('div');w.className='wire';row.append(w)});let co=document.createElement('div');co.className='coil';let b=document.createElement('button');b.style.background='transparent';b.style.border='0';b.innerHTML='<div class="symbol">—( '+r.coil.type+r.coil.n+' )—</div>';b.onclick=()=>r.coil={type:devtype.value,n:+devnum.value};co.append(b);row.append(co);row.append(document.createElement('div')).className='wire';let rail2=document.createElement('div');rail2.className='rail';row.append(rail2);card.append(row);e.append(card)});toolUI()}
function put(ri,ci){if(chosen==='DEL'){rungs[ri].cells[ci]=null}else{let d=dev();let c={type:chosen,dev:d};if(chosen==='TON')c.ms=1500;if(chosen==='CTU')c.target=3;rungs[ri].cells[ci]=c}renderLadder()}
function addRung(){rungs.push({cells:[],coil:{type:devtype.value,n:+devnum.value}});renderLadder()}function removeRung(i){if(rungs.length>1)rungs.splice(i,1);renderLadder()}
function preset(p){stop();if(p==='clear')rungs=[{cells:[],coil:{type:'Y',n:0}}];if(p==='startstop')rungs=[{cells:[{type:'NO',dev:'X0'},{type:'NC',dev:'X1'}],coil:{type:'M',n:0}},{cells:[{type:'NO',dev:'M0'},{type:'NC',dev:'X1'}],coil:{type:'M',n:0}},{cells:[{type:'NO',dev:'M0'}],coil:{type:'Y',n:0}}];if(p==='auto')rungs=[{cells:[{type:'NO',dev:'X0'},{type:'NC',dev:'X1'}],coil:{type:'M',n:0}},{cells:[{type:'NO',dev:'M0'},{type:'NO',dev:'X7'}],coil:{type:'Y',n:0}},{cells:[{type:'NO',dev:'Y0'},{type:'NO',dev:'X8'}],coil:{type:'Y',n:1}}];renderLadder()}
function read(d){let t=d[0],n=+d.slice(1),k=d;if(t==='X')return !!xv[k];if(t==='Y')return !!yv[k];if(t==='M')return !!mv[k];if(t==='T')return !!tv[k];if(t==='C')return (cv[k]||0)>=(cv[k+'_target']||1);return false}
function scan(){refreshInputBits();let ny={...yv},nm={...mv},actions=[];rungs.forEach(r=>{let q=true;for(let c of r.cells){if(!c)continue;if(c.type==='NO')q=q&&read(c.dev);if(c.type==='NC')q=q&&!read(c.dev);if(c.type==='TON'){timers[c.dev]=q?(timers[c.dev]||0)+100:0;tv[c.dev]=timers[c.dev]>=c.ms;q=q&&tv[c.dev]}if(c.type==='CTU'){let edge=q&&!counterEdge[c.dev];if(edge)cv[c.dev]=(cv[c.dev]||0)+1;counterEdge[c.dev]=q;cv[c.dev+'_target']=c.target;q=q&&(cv[c.dev]||0)>=c.target}if(c.type==='SET'||c.type==='RST')actions.push({type:c.type,dev:c.dev,cond:q})}let key=r.coil.type+r.coil.n;if(r.coil.type==='Y')ny[key]=q;if(r.coil.type==='M')nm[key]=q});actions.forEach(a=>{if(a.cond){if(a.type==='SET'){if(a.dev[0]==='Y')ny[a.dev]=true;else nm[a.dev]=true}else{ny[a.dev]=false;nm[a.dev]=false}}});yv=ny;mv=nm;scans++;renderStates();controlUI();log('スキャン '+scans)}
function stepScan(){scan()}function run(){if(running)return;running=true;interval=setInterval(()=>{scan();moveWork()},100);log('RUN')}function stop(){running=false;clearInterval(interval);interval=null;log('STOP')}
function moveWork(){if(yv.Y0||yv.Y1){workPos+=1.2;if(workPos>90)workPos=8;inputs.MS1=workPos>32&&workPos<37;inputs.MS2=workPos>68&&workPos<73;document.getElementById('work').style.left=workPos+'%';refreshInputBits()}}
function resetAll(){stop();xv={};yv={};mv={};tv={};cv={};timers={};counterEdge={};inputs.MS1=false;inputs.MS2=false;workPos=10;scans=0;document.getElementById('work').style.left=workPos+'%';refreshInputBits();renderStates();controlUI();log('リセット')}
function renderStates(){let e=document.getElementById('states');e.innerHTML='';['X0 PB1','X1 PB2','X7 MS1','X8 MS2','Y0 PL1','Y1 PL2','Y2 PL3','Y3 PL4','M0内部リレー'].forEach(v=>{let [k,label]=v.split(' ');let val=k[0]==='X'?read(k):k[0]==='Y'?read(k):read(k);let b=document.createElement('div');b.className='statebox';b.innerHTML=label+' <b class="'+(val?'ontext':'')+'">'+(val?'ON':'OFF')+'</b>';e.append(b)});document.getElementById('plcstatus').textContent='スキャン: '+scans+' | ON出力: '+Object.keys(yv).filter(k=>yv[k]).join(', ')+' | 内部リレー: '+Object.keys(mv).filter(k=>mv[k]).join(', ')+' | タイマー: '+Object.entries(timers).map(([k,v])=>k+' '+v+'ms').join(', ')+' | カウンタ: '+Object.entries(cv).filter(([k])=>!k.endsWith('_target')).map(([k,v])=>k+'='+v).join(', ')}
function log(s){let e=document.getElementById('logs');e.textContent=s+'\n'+e.textContent}
function saveJSON(){let data={rungs};let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='sequence-training.json';a.click()}
function loadJSON(){let inp=document.createElement('input');inp.type='file';inp.accept='.json';inp.onchange=e=>{let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{try{rungs=JSON.parse(rd.result).rungs;renderLadder()}catch(err){alert('JSONを読み込めません')}};rd.readAsText(f)};inp.click()}
termUI();toolUI();renderLadder();refreshInputBits();controlUI();renderStates();
</script></body></html>
