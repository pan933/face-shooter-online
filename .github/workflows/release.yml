name: Release Desktop App

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: ゲームのファイルをコピー
        run: |
          mkdir -p game
          cp -r ../顔面シューティング_GitHubPages版/. game/

      - name: 依存関係をインストール
        run: npm install

      - name: バージョンを自動で設定
        run: npm version 1.0.${{ github.run_number }} --no-git-tag-version --allow-same-version

      - name: ビルド
        run: npx electron-builder --win --publish never

      - name: Releaseを作成してアップロード
        run: |
          gh release create v1.0.${{ github.run_number }} \
            dist/FaceShooting-Setup-*.exe \
            dist/FaceShooting-Setup-*.exe.blockmap \
            dist/latest.yml \
            --title "1.0.${{ github.run_number }}" \
            --notes "自動ビルド" \
            --target ${{ github.sha }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
